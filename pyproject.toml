[project]
name = "genai-science"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "anthropic>=0.79.0",
    "dotenv>=0.9.9",
    "google>=3.0.0",
    "google-genai>=1.62.0",
    "ipykernel>=7.2.0",
    "openai>=2.17.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "tqdm>=4.67.3",
    "torch==2.4.0+cu118",
    "torchvision==0.19.0+cu118",
    "torchaudio==2.4.0+cu118",
    "numpy<2.0",
    "transformers>=5.2.0",
    "accelerate>=1.12.0",
    "seaborn>=0.13.2",
]

[tool.uv]
index-strategy = "unsafe-best-match"
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu118"
